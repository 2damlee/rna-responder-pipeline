name: RNA Ingestion Pipeline

on:
  workflow_dispatch:
    inputs:
      accession:
        description: 'GEO accession to process'
        required: true
        default: 'GSE91061'
        type: choice
        options:
          - GSE91061
          - GSE78220
      upload_s3:
        description: 'Upload processed parquets to S3'
        required: false
        default: false
        type: boolean

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download GSE78220 supplementary expression file
        if: github.event.inputs.accession == 'GSE78220'
        run: |
          mkdir -p data/raw/geo
          curl -L \
            --retry 3 \
            --retry-delay 5 \
            -o data/raw/geo/GSE78220_PatientFPKM.xlsx \
            "https://ftp.ncbi.nlm.nih.gov/geo/series/GSE78nnn/GSE78220/suppl/GSE78220_PatientFPKM.xlsx"
          echo "Downloaded file size: $(du -h data/raw/geo/GSE78220_PatientFPKM.xlsx)"

      - name: Run ingestion pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          ARGS="--accession ${{ github.event.inputs.accession }}"
          if [ "${{ github.event.inputs.upload_s3 }}" = "true" ]; then
            ARGS="$ARGS --upload-s3"
          fi
          python -m pipeline.flows.ingest_geo $ARGS

      - name: Upload QC summary as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-summary-${{ github.event.inputs.accession }}
          path: outputs/tables/*_qc_summary.csv
          retention-days: 30