name: RNA Ingestion Pipeline

on:
  workflow_dispatch:
    inputs:
      upload_s3:
        description: 'Upload processed parquets to S3'
        required: false
        default: false
        type: boolean

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Run GSE91061 ingestion pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          ARGS="--accession GSE91061"
          if [ "${{ github.event.inputs.upload_s3 }}" = "true" ]; then
            ARGS="$ARGS --upload-s3"
          fi
          python -m pipeline.flows.ingest_geo $ARGS

      - name: Upload QC summary as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-summary-GSE91061
          path: outputs/tables/gse91061_qc_summary.csv
          retention-days: 30