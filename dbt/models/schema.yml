version: 2

models:
  - name: stg_gse78220_expression
    columns:
      - name: gene_id
        tests:
          - not_null

      - name: sample_id
        tests:
          - not_null

      - name: response_label
        tests:
          - accepted_values:
              values: ['responder', 'non_responder']

  - name: int_baseline_log_expression
    columns:
      - name: log2_expression
        tests:
          - not_null

  - name: mart_top_differential_genes
    columns:
      - name: gene_id
        tests:
          - not_null
          - unique

      - name: abs_mean_diff
        tests:
          - not_null

  - name: mart_dataset_comparison
    description: >
      Cohort-level summary per dataset and response group.
      Used to compare GSE78220 and GSE91061 baseline cohort compositions.
    columns:
      - name: dataset_accession
        tests:
          - not_null
      - name: response_label
        tests:
          - not_null
      - name: sample_count
        tests:
          - not_null